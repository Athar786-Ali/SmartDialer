version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: smartdialer
      POSTGRES_USER: dialer
      POSTGRES_PASSWORD: dialer_pass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./smart_dialer/store/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dialer -d smartdialer"]
      interval: 2s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
